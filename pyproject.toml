[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glassy"
version = "1.0"
description = "A library for exploring the set of good models."
readme = "README.md"
authors = [ { name = "Jeffrey Ryan" } ]
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scikit-learn>=1.0"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools]
packages = ["glassy"]
